name: CI
on: [push, pull_request]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  { php-version: '8.3', extensions: 'mbstring, intl, pdo_sqlite, pdo_mysql', coverage: none }
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 24, cache: pnpm }
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate
            - run: pnpm install --frozen-lockfile
            - run: pnpm types:generate
            - name: Tipos generados al dia
              run: git diff --exit-code resources/js/types resources/js/routes resources/js/actions
            - run: vendor/bin/pint --test
            - run: pnpm check
            - run: php artisan test
            - run: pnpm build

    e2e:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: laravel_boilerplate_e2e
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with: { php-version: '8.3', extensions: 'mbstring, intl, pdo_mysql', coverage: none }
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 24, cache: pnpm }
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm build
            - run: pnpm exec playwright test
              env:
                  DB_HOST: 127.0.0.1
                  DB_USERNAME: root
                  DB_PASSWORD: ''
            - uses: actions/upload-artifact@v4
              if: failure()
              with: { name: playwright-traces, path: test-results }
